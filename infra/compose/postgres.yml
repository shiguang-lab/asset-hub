name: asset-hub-postgres

services:
  postgres:
    image: m.daocloud.io/docker.io/pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asset_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-asset_hub}
    ports:
      - "${POSTGRES_BIND:-100.87.115.78:5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asset_hub} -d ${POSTGRES_DB:-asset_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
