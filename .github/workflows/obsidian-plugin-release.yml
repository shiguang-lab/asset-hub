name: Release Obsidian plugin

# 与镜像发布同一策略：只在推送版本 tag 时构建插件并产出 GitHub Release。
# Release 附件（main.js / manifest.json / styles.css）既是手动安装来源，
# 也是日后上架 Obsidian 社区市场所需的形式。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: obsidian-plugin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gh release --generate-notes 需要完整的 tag 历史。
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert tag matches manifest version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          manifest_version="$(node -p "require('./apps/obsidian-plugin/manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "tag ${REF_NAME} 与 manifest.json 的版本 ${manifest_version} 不一致" >&2
            exit 1
          fi
          echo "版本一致：${manifest_version}"

      - name: Test
        run: pnpm --filter @shiguang/obsidian-plugin test

      - name: Build
        run: pnpm --filter @shiguang/obsidian-plugin build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            --title "$REF_NAME" \
            --generate-notes \
            apps/obsidian-plugin/main.js \
            apps/obsidian-plugin/manifest.json \
            apps/obsidian-plugin/styles.css
