name: Publish Asset Hub images

on:
  push:
    branches: [main]
    tags: ["v*", "v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example 0.1.0 or latest)
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: asset-hub-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: ghcr.io/shiguang-lab

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: web
            image: asset-hub-web
          - target: api
            image: asset-hub-api
          - target: worker
            image: asset-hub-worker
          - target: compute-worker
            image: asset-hub-compute-worker
          - target: public-gateway
            image: asset-hub-public-gateway
          - target: ssr
            image: asset-hub-ssr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            primary="${INPUT_TAG:-latest}"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            primary="${REF_NAME#v}"
          else
            primary="latest"
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$primary"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "$IMAGE_NAME:$REF_NAME"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Shiguang Asset Hub (${{ matrix.image }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=asset-hub-${{ matrix.target }}
          cache-to: type=gha,scope=asset-hub-${{ matrix.target }},mode=max
