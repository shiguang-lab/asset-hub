name: Publish Asset Hub images

# 只在推送版本 tag 时构建并发布镜像；main 分支的普通提交不再触发发布。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: asset-hub-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: ghcr.io/shiguang-lab

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: web
            image: asset-hub-web
          - target: api
            image: asset-hub-api
          - target: worker
            image: asset-hub-worker
          - target: compute-worker
            image: asset-hub-compute-worker
          - target: public-gateway
            image: asset-hub-public-gateway
          - target: ssr
            image: asset-hub-ssr
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Tag '$REF_NAME' carries no version; expected the form vX.Y.Z." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$version"
            echo "$IMAGE_NAME:$REF_NAME"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            echo "$IMAGE_NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Shiguang Asset Hub (${{ matrix.image }})
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=asset-hub-${{ matrix.target }}
          cache-to: type=gha,scope=asset-hub-${{ matrix.target }},mode=max
