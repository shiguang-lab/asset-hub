name: Build image

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/shiguang-lab

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Tag '$REF_NAME' carries no version; expected the form vX.Y.Z." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$version"
            echo "$IMAGE_NAME:$REF_NAME"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            echo "$IMAGE_NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Shiguang Asset Hub (${{ inputs.image }})
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=asset-hub-${{ inputs.target }}
          cache-to: type=gha,scope=asset-hub-${{ inputs.target }},mode=max
